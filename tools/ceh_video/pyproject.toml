[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ceh-video"
version = "0.1.0"
description = "Local CEH production, verified caching and evidence-bound review"
requires-python = ">=3.12"

[project.scripts]
ceh-video = "ceh_video.__main__:main"

[tool.setuptools.package-data]
ceh_video = ["runtime/*.py", "runtime/*.mjs", "*.mjs"]
