[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ceh-video"
version = "0.5.3"
description = "Editorial teaching video production, verified caching and evidence-bound review"
requires-python = ">=3.12"

[project.scripts]
ceh-video = "ceh_video.__main__:main"

[tool.setuptools.package-data]
ceh_video = ["runtime/*.py", "runtime/*.mjs", "*.mjs", "visual/*.mjs", "visual/*.js", "visual/*.json", "visual/*.md"]
